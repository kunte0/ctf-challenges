version: '3.7'

services:
  nginx:
    image: nginx:mainline-alpine
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - ./nginx:/etc/nginx/templates
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    networks:
      - net


  app:
    build: ./app/
    restart: unless-stopped
    env_file: .env
    environment:
      - NPM_RUN_SCRIPT=$NPM_RUN_SCRIPT
    depends_on: 
      - db
      - nginx
    volumes:
      - ./app/:/app/:ro
    networks:
      - net

  db:
    image: mongo
    restart: unless-stopped
    env_file: .env
    volumes:     
      - ./dbdata:/data/db
      - ./db/:/docker-entrypoint-initdb.d
    networks:
      - net

networks:
  net:
    name: net

